name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Download NLTK data
        run: python -c "import nltk; [nltk.download(p, quiet=True) for p in ['punkt','punkt_tab','vader_lexicon','stopwords']]"
      - run: python -m pytest tests/ -q
